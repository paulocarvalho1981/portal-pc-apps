<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
<title id="pageTitleTag">Unit Converter</title>

  <!-- ÍCONE -->
  <link rel="icon" type="image/png" href="../assets/images/calc.png">

  <!-- CSS -->
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- TOPO FIXO -->
  <header class="top">
    <a href="../index.html" class="back-link">← Voltar</a>

    <div class="title">
      <img src="../assets/images/calc.png" alt="Calc" class="title-icon">
     <h1 id="pageTitle"></h1>
    </div>

    <div class="lang-switch">
  <button id="langPT" class="lang active">PT</button>
  <button id="langEN" class="lang">EN</button>
</div>
<button id="helpBtn" class="help-btn">ℹ️ Instructions</button>

  </header>

  <!-- CONTEÚDO -->
  <main class="content">

<div class="unit-tabs">
<button class="tab active" data-type="length"></button>
<button class="tab" data-type="pressure"></button>
<button class="tab" data-type="density"></button>
<button class="tab" data-type="weight"></button>
<button class="tab" data-type="torque"></button>
<button class="tab" data-type="area"></button>

</div>


    <!-- BLOCO MODELO -->
    <section class="unit-block">



      <h2 id="unitTitle"></h2>

      <div class="unit-grid">

  <!-- CÁLCULO -->
  <div class="calc-box">
    <h3></h3>

<label>
  <span id="labelValue"></span>
  <input type="number" id="lenValue">
</label>

<label>
  <span id="labelFrom"></span>
  <select id="lenFrom"></select>
</label>

<label>
  <span id="labelTo"></span>
  <select id="lenTo"></select>
</label>


<button type="button" id="invertBtn" class="invert-btn"></button>

    <div class="result">
      Resultado:
      <strong id="lenResult">—</strong>
    </div>
  </div> <!-- ✅ FECHOU calc-box -->

  <!-- REFERÊNCIA -->
  <div class="ref-box">
    <h3></h3>
    <ul id="unitReference"></ul>
  </div>

</div>

    </section>

    <!-- OUTROS BLOCOS VIRÃO AQUI -->
    <!-- Pressão | Densidade | Peso | Temperatura -->

  </main>

  <!-- JS -->
  <script src="script.js"></script>
  <!-- POPUP INSTRUCTIONS -->
<div id="helpOverlay" class="modal-overlay hidden">
  <div class="modal">
    <button class="modal-close" id="closeHelp">✕</button>
    <h2 id="helpTitle"></h2>
    <ul id="helpContent"></ul>
  </div>
</div>

</body>
</html>
