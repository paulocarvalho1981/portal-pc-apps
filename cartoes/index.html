<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Facilitador de Troca de Cartão T</title>

  <link rel="stylesheet" href="cartoes.css">

  <!-- PDF.js (OBRIGATÓRIO antes do seu JS) -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
</head>

<body>
<div class="top-bar">
  <a href="../index.html" class="btn-voltar">← Portal</a>

  <button type="button" class="btn-limpar" onclick="limparResultados()">
    Limpar Resultado
  </button>
</div>


  <h1>Facilitador de Troca de Cartão T</h1>

<section class="upload">
  <h2>Arquivos PDF</h2>

  <div class="upload-grid">

    <div class="drop-zone" id="dropDia1">
      PDF de ontem
      <input type="file" id="pdfDia1" accept="application/pdf">
    </div>

    <div class="drop-zone" id="dropDia2">
      PDF de hoje
      <input type="file" id="pdfDia2" accept="application/pdf">
    </div>

  </div>
</section>

<section class="resultado">
  <h2>Resultado</h2>

  <button type="button" onclick="imprimirResultado()">
    Imprimir Resultado
  </button>

 
 
 <div id="blocoDias"
 
  <div class="resultado-grid">

    <div class="resultado-coluna">
      <h3>Retirar</h3>
      <div id="resultadoDia1"></div>
    </div>

    <div class="resultado-coluna">
      <h3>Adicionar</h3>
      <div id="resultadoDia2"></div>
    </div>

  </div>
</div>

  <!-- 🔽 COMPARAÇÃO LB x LB (ESSENCIAL) -->
  <div id="resultadoComparacao"></div>

</section>




  <!-- SEU SCRIPT SEMPRE POR ÚLTIMO -->
  <script src="cartoes.js"></script>

</body>
</html>
