<!DOCTYPE html>
<html lang="pt-BR">

<head>

<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Save the Date">

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">

<title>Save the Date</title>

<link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Playfair+Display:wght@300;400&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
font-family:'Playfair Display', serif;
color:white;
overflow:hidden;
opacity:0;
animation:fadeIn 2s ease forwards;
}

@keyframes fadeIn{
from{opacity:0;}
to{opacity:1;}
}

/* FADE ELEMENTOS */

.fade{
opacity:0;
animation:fadeUp 1.5s ease forwards;
}

@keyframes fadeUp{
from{
opacity:0;
transform:translateY(25px);
}
to{
opacity:1;
transform:translateY(0);
}
}

.d1{animation-delay:1s;}
.d2{animation-delay:2s;}
.d3{animation-delay:3s;}
.d4{animation-delay:4s;}
.d5{animation-delay:5s;}
.d6{animation-delay:6s;}
.d7{animation-delay:7s;}

/* VIDEO */

.video-bg{
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
object-fit:cover;
object-position:top 10%;
z-index:-2;
}

/* OVERLAY */

.overlay{
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
background:rgba(0,0,0,0.35);
z-index:-1;
}

/* CONTAINER */

.container{
min-height:100dvh;
display:flex;
flex-direction:column;
justify-content:center;
align-items:center;
text-align:center;
padding:30px 20px;
}

/* SAVE THE DATE */

.save img{
width:420px;
max-width:70vw;
margin-bottom:5px;
margin-top:-10px;
}

/* TEXTO */

.message{
font-size:14px;
margin-bottom:10px;
}

/* NOMES */

.names-block{
font-family:'Great Vibes', cursive;
text-align:center;
margin:15px 0;
}

.row1{
font-size:80px;
margin-left:-60px;
line-height:0.8;
}

.row2{
display:flex;
justify-content:center;
align-items:center;
gap:40px;
margin:5px 0;
}

.row3{
font-size:80px;
margin-left:40px;
line-height:0.9;
}

.e{
font-family:'Playfair Display', serif;
font-size:22px;
}

/* CORAÇÃO PULSANDO */

.heart-big{
font-size:70px;
color:#d4af37;
animation:pulse 2s infinite;
}

@keyframes pulse{
0%{transform:scale(1);}
50%{transform:scale(1.15);}
100%{transform:scale(1);}
}

/* CORAÇÃO LINHA */

.heart{
color:#d4af37;
font-size:24px;
}

/* DATA COM BRILHO */

.date{
margin:10px 0;
font-size:22px;
color:#d4af37;
}


@keyframes goldGlow{

0%{
text-shadow:0 0 2px #d4af37;
}

50%{
text-shadow:0 0 12px #ffd700;
}

100%{
text-shadow:0 0 2px #d4af37;
}

}

/* LINHA */

.line{
margin:10px 0;
color:#d4af37;
font-size:18px;
}

/* CONTADOR */

.countdown{
display:flex;
gap:35px;
margin-top:10px;
}

.countdown div{
text-align:center;
}

.number{
font-size:42px;
font-weight:bold;
animation:flip 0.6s;
}

@keyframes flip{
0%{transform:rotateX(90deg);}
100%{transform:rotateX(0deg);}
}

.label{
font-size:12px;
letter-spacing:2px;
}

/* RESPONSIVO */

@media (max-height:700px){

.save img{
width:400px;
}

.row1,
.row3{
font-size:65px;
}

.heart-big{
margin-top:30px;
font-size:70px;
}

.countdown{
gap:20px;
}

.number{
font-size:32px;
}

}

</style>

</head>

<body>

<video class="video-bg" autoplay muted loop playsinline>
<source src="video.mp4" type="video/mp4">
</video>

<div class="overlay"></div>

<div class="container">

<div class="save fade d1">
<img src="save-the-date.png" alt="Save the Date">
</div>

<div class="names-block">

<div class="row1 fade d2">Paulo</div>

<div class="row2 fade d3">
<span class="e">E</span>
<span class="heart-big">♡</span>
</div>

<div class="row3 fade d4">Hagata</div>

</div>

<div class="message fade d5">Te aguardamos para o nosso casamento em</div>

<div class="date fade d6">18 • Maio • 2026</div>

<div class="line fade d7">──── <span class="heart">♥</span> ────</div>

<div class="message fade d7">Estamos contando os dias</div>

<div class="countdown fade d7">

<div>
<div class="number" id="days"></div>
<div class="label">DIAS</div>
</div>

<div>
<div class="number" id="hours"></div>
<div class="label">HORAS</div>
</div>

<div>
<div class="number" id="minutes"></div>
<div class="label">MIN</div>
</div>

<div>
<div class="number" id="seconds"></div>
<div class="label">SEG</div>
</div>

</div>

</div>

<script>

const targetDate = new Date("May 18, 2026 00:00:00").getTime();

function updateCountdown(){

const now = new Date().getTime();
const distance = targetDate - now;

const days = Math.floor(distance / (1000*60*60*24));
const hours = Math.floor((distance % (1000*60*60*24))/(1000*60*60));
const minutes = Math.floor((distance % (1000*60*60))/(1000*60));
const seconds = Math.floor((distance % (1000*60))/1000);

document.getElementById("days").innerText = days;
document.getElementById("hours").innerText = hours;
document.getElementById("minutes").innerText = minutes;
document.getElementById("seconds").innerText = seconds;

}

setInterval(updateCountdown,1000);

updateCountdown();
/* recarrega a página a cada 20 segundos */
setInterval(function(){
location.reload();
},20000);
</script>

</body>
</html>
